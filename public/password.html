<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PhiCrypto - Authentication</title>
    <meta name="description" content="Secure login for PhiCrypto encryption tool">
    <link rel="icon" type="image/png" href="icon.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-color: #667eea;
            --primary-dark: #5a67d8;
            --secondary-color: #764ba2;
            --error-color: #f56565;
            --success-color: #48bb78;
            --bg-color: #1a202c;
            --surface-color: #2d3748;
            --text-primary: #ffffff;
            --text-secondary: #a0aec0;
            --border-color: #4a5568;
            --shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
            --border-radius: 12px;
            --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, var(--bg-color) 0%, #2a4365 100%);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: hidden;
        }

        /* Animated background */
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: 
                radial-gradient(circle at 20% 20%, rgba(102, 126, 234, 0.1) 0%, transparent 50%),
                radial-gradient(circle at 80% 80%, rgba(118, 75, 162, 0.1) 0%, transparent 50%);
            z-index: -1;
            animation: backgroundFloat 20s ease-in-out infinite;
        }

        @keyframes backgroundFloat {
            0%, 100% { transform: translateY(0px) rotate(0deg); }
            50% { transform: translateY(-20px) rotate(1deg); }
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-10px); }
            75% { transform: translateX(10px); }
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }

        .container {
            background: var(--surface-color);
            padding: 3rem;
            border-radius: var(--border-radius);
            box-shadow: var(--shadow);
            border: 1px solid var(--border-color);
            width: 100%;
            max-width: 400px;
            margin: 1rem;
            position: relative;
            overflow: hidden;
            animation: fadeInUp 0.8s ease-out;
        }

        .container::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 4px;
            background: linear-gradient(90deg, var(--primary-color), var(--secondary-color));
        }

        .logo {
            text-align: center;
            margin-bottom: 2rem;
        }

        .logo h1 {
            margin: 0;
            font-size: 2.5rem;
            font-weight: 700;
            background: linear-gradient(135deg, var(--primary-color), var(--secondary-color));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            animation: pulse 4s ease-in-out infinite;
        }

        .logo p {
            margin: 0.5rem 0 0 0;
            color: var(--text-secondary);
            font-size: 0.9rem;
        }

        .form-group {
            margin-bottom: 1.5rem;
        }

        .form-group label {
            display: block;
            margin-bottom: 0.5rem;
            font-weight: 600;
            color: var(--text-primary);
        }

        .password-input-wrapper {
            position: relative;
        }

        .form-group input {
            width: 100%;
            padding: 1rem;
            border: 2px solid var(--border-color);
            border-radius: 8px;
            background: var(--bg-color);
            color: var(--text-primary);
            font-size: 1rem;
            transition: var(--transition);
            outline: none;
        }

        .form-group input:focus {
            border-color: var(--primary-color);
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.2);
        }

        .toggle-password {
            position: absolute;
            right: 1rem;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            color: var(--text-secondary);
            cursor: pointer;
            font-size: 1.2rem;
        }

        .toggle-password:hover {
            color: var(--primary-color);
        }

        .submit-btn {
            width: 100%;
            padding: 1rem;
            background: linear-gradient(135deg, var(--primary-color), var(--primary-dark));
            color: white;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            font-size: 1rem;
            cursor: pointer;
            transition: var(--transition);
            position: relative;
            overflow: hidden;
        }

        .submit-btn:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(102, 126, 234, 0.4);
        }

        .submit-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .submit-btn.loading::after {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 20px;
            height: 20px;
            margin: -10px 0 0 -10px;
            border: 2px solid transparent;
            border-top: 2px solid white;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .error {
            background: rgba(245, 101, 101, 0.1);
            border: 1px solid var(--error-color);
            color: var(--error-color);
            padding: 1rem;
            border-radius: 8px;
            margin-top: 1rem;
            font-size: 0.9rem;
            display: none;
            animation: shake 0.6s ease-out;
        }

        .error.show {
            display: block;
        }

        .attempts-warning {
            background: rgba(237, 137, 54, 0.1);
            border: 1px solid #ed8936;
            color: #ed8936;
            padding: 0.75rem;
            border-radius: 8px;
            margin-top: 1rem;
            font-size: 0.8rem;
            display: none;
        }

        .attempts-warning.show {
            display: block;
        }

        .footer {
            text-align: center;
            margin-top: 2rem;
            color: var(--text-secondary);
            font-size: 0.8rem;
        }

        .footer a {
            color: var(--primary-color);
            text-decoration: none;
        }

        .footer a:hover {
            text-decoration: underline;
        }

        /* Mobile responsiveness */
        @media (max-width: 480px) {
            .container {
                padding: 2rem;
                margin: 0.5rem;
            }
            
            .logo h1 {
                font-size: 2rem;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo">
            <h1>🔐 PhiCrypto</h1>
            <p>Secure authentication required</p>
        </div>
        
        <form id="passwordForm">
            <div class="form-group">
                <label for="password">Password</label>
                <div class="password-input-wrapper">
                    <input 
                        type="password" 
                        name="password" 
                        id="password" 
                        placeholder="Enter your password" 
                        required 
                        autocomplete="current-password"
                    >
                    <button type="button" class="toggle-password" id="togglePassword" title="Show/hide password">
                        👁️
                    </button>
                </div>
            </div>
            
            <button type="submit" class="submit-btn" id="submitBtn">
                🚀 Access PhiCrypto
            </button>
        </form>
        
        <div class="error" id="error"></div>
        <div class="attempts-warning" id="attemptsWarning"></div>
        
        <div class="footer">
            <small>
                Protected by PhiCrypto Security System<br>
                <a href="https://github.com/7aGiven/PhigrosLibrary" target="_blank" rel="noopener">
                    Powered by PhigrosLibrary
                </a>
            </small>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const form = document.getElementById('passwordForm');
            const passwordInput = document.getElementById('password');
            const submitBtn = document.getElementById('submitBtn');
            const errorDiv = document.getElementById('error');
            const attemptsWarning = document.getElementById('attemptsWarning');
            const togglePasswordBtn = document.getElementById('togglePassword');
            
            let failedAttempts = 0;
            
            // Check if already authenticated
            fetch('/check-cookie')
                .then(response => response.json())
                .then(data => {
                    if (data.valid) {
                        window.location.href = '/';
                    }
                })
                .catch(() => {
                    // Ignore errors during cookie check
                });
            
            // Toggle password visibility
            togglePasswordBtn.addEventListener('click', function() {
                const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
                passwordInput.setAttribute('type', type);
                togglePasswordBtn.textContent = type === 'password' ? '👁️' : '🙈';
            });
            
            // Clear errors when typing
            passwordInput.addEventListener('input', function() {
                hideError();
                hideAttemptsWarning();
            });
            
            // Form submission
            form.addEventListener('submit', function(event) {
                event.preventDefault();
                
                const password = passwordInput.value.trim();
                
                if (!password) {
                    showError('Please enter a password');
                    return;
                }
                
                setLoading(true);
                hideError();
                
                fetch('/check-password', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ password })
                })
                .then(response => response.json())
                .then(data => {
                    setLoading(false);
                    
                    if (data.success) {
                        showSuccess();
                        setTimeout(() => {
                            window.location.href = '/';
                        }, 1000);
                    } else {
                        failedAttempts++;
                        showError(data.error || 'Invalid password');
                        
                        if (failedAttempts >= 3) {
                            showAttemptsWarning(`Warning: ${failedAttempts} failed attempts. Too many failures may result in temporary lockout.`);
                        }
                        
                        if (data.retryAfter) {
                            showError(`Too many failed attempts. Please try again in ${Math.ceil(data.retryAfter / 60)} minutes.`);
                        }
                        
                        passwordInput.value = '';
                        passwordInput.focus();
                    }
                })
                .catch(error => {
                    setLoading(false);
                    showError('Connection error. Please try again.');
                    console.error('Login error:', error);
                });
            });
            
            function setLoading(loading) {
                submitBtn.disabled = loading;
                if (loading) {
                    submitBtn.classList.add('loading');
                    submitBtn.textContent = '';
                } else {
                    submitBtn.classList.remove('loading');
                    submitBtn.textContent = '🚀 Access PhiCrypto';
                }
            }
            
            function showError(message) {
                errorDiv.textContent = message;
                errorDiv.classList.add('show');
                document.querySelector('.container').style.animation = 'shake 0.6s ease-out';
            }
            
            function hideError() {
                errorDiv.classList.remove('show');
            }
            
            function showAttemptsWarning(message) {
                attemptsWarning.textContent = message;
                attemptsWarning.classList.add('show');
            }
            
            function hideAttemptsWarning() {
                attemptsWarning.classList.remove('show');
            }
            
            function showSuccess() {
                submitBtn.style.background = 'linear-gradient(135deg, #48bb78, #38a169)';
                submitBtn.textContent = '✅ Access Granted';
            }
            
            // Focus password input on load
            passwordInput.focus();
        });
    </script>
</body>
</html>
